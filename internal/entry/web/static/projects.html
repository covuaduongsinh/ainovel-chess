<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ainovel — Chọn dự án</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/projects.css" />
</head>
<body>
  <header class="pk-head">
    <div class="pk-wrap">
      <div class="pk-brand">
        <div>
          <h1>✦ ainovel — Dự án sách</h1>
          <p class="pk-lead">Chọn một dự án để mở, hoặc tạo dự án mới. Mỗi dự án là một cuốn sách riêng.</p>
        </div>
        <div class="pk-root" id="root"></div>
      </div>

      <form id="createForm" class="pk-create">
        <input type="text" id="name" placeholder="Tên sách mới, vd: Kiếm khách phương Nam" autocomplete="off" />
        <button type="submit" id="createBtn" class="btn primary">+ Tạo &amp; mở</button>
      </form>
      <div class="pk-create-hint">Tên sẽ được chuyển thành tên thư mục an toàn trong <code id="rootHint">output</code>.</div>
      <div class="errline" id="err" hidden></div>

      <div class="pk-tools">
        <div class="pk-search">
          <span class="pk-search-icon">🔍</span>
          <input type="text" id="query" placeholder="Lọc theo tên dự án…" autocomplete="off" />
          <button type="button" class="pk-search-clear" id="queryClear" title="Xóa bộ lọc" hidden>×</button>
        </div>

        <select id="sort" title="Sắp xếp danh sách">
          <option value="recent">Sửa gần nhất</option>
          <option value="name">Tên A→Z</option>
          <option value="words">Nhiều chữ nhất</option>
          <option value="progress">Tiến độ cao nhất</option>
        </select>

        <div class="pk-tabs">
          <button type="button" id="tabActive" class="on">Đang dùng</button>
          <button type="button" id="tabArchived">Lưu trữ</button>
        </div>

        <div class="pk-count" id="count"></div>
      </div>
    </div>
  </header>

  <main class="pk-body">
    <div class="pk-wrap">
      <div class="pk-grid" id="grid"></div>
      <div class="pk-empty" id="empty">Đang tải…</div>
    </div>
  </main>

  <!-- Hộp thoại đổi tên -->
  <div class="overlay" id="renameOverlay" hidden>
    <div class="modal">
      <h2>Đổi tên dự án</h2>
      <div class="sub" id="renameSub"></div>
      <label for="renameInput">Tên sách mới</label>
      <input type="text" id="renameInput" autocomplete="off" />
      <div class="pk-preview" id="renamePreview"></div>
      <div class="errline" id="renameErr" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="renameCancel">Hủy</button>
        <button type="button" class="btn primary" id="renameOk">Lưu</button>
      </div>
    </div>
  </div>

  <!-- Hộp thoại xóa vĩnh viễn -->
  <div class="overlay" id="deleteOverlay" hidden>
    <div class="modal">
      <h2>Xóa dự án vĩnh viễn</h2>
      <div class="sub" id="deleteSub"></div>
      <div class="pk-danger" id="deleteWarn"></div>
      <label for="deleteInput">Gõ chính xác tên dự án để xác nhận</label>
      <input type="text" id="deleteInput" autocomplete="off" />
      <div class="errline" id="deleteErr" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="deleteCancel">Hủy</button>
        <button type="button" class="btn warn" id="deleteOk" disabled>Xóa vĩnh viễn</button>
      </div>
    </div>
  </div>

  <script src="/projects.js"></script>
</body>
</html>
